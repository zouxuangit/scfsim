name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: fast tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pytest-cov
      - name: Fast test suite
        run: pytest tests/ -q -m "not slow" --cov=scfsim --cov-report=term-missing

  floor:
    name: minimum declared dependencies (py3.9, numpy 1.22, networkx 2.8, matplotlib 3.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install at the floor of every version range in pyproject.toml
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.22.4" "networkx==2.8" "matplotlib==3.5.3" "pytest>=7"
          pip install -e . --no-deps
      - name: Fast test suite at the floor
        run: pytest tests/ -q -m "not slow"
      - name: The paper's headline numbers at the floor
        run: pytest tests/test_manuscript.py -q -k table_5

  slow:
    name: randomised property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Slow test suite
        run: pytest tests/ -q -m "slow" --statics-runs=40

  docs-and-examples:
    name: API reference and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: API reference is in sync with the source
        run: |
          python docs/gen_api.py
          git diff --exit-code -- docs/API.md \
            || (echo "::error::docs/API.md is stale — run 'python docs/gen_api.py' and commit the result" && exit 1)
      - name: Architecture figure regenerates
        run: python docs/gen_fig1.py
      - name: Examples run end to end
        run: python examples/blockchain_switch.py
          python examples/channels_and_sensitivity.py --quick
          python examples/custom_network.py
