[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scfsim"
version = "0.16.3"
description = "Agent-based simulation of credit risk propagation in supply chain finance networks"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SCFSim developers"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "networkx>=2.8", "matplotlib>=3.5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["scfsim*"]

[tool.pytest.ini_options]
markers = [
    "slow: randomised property tests and large ablations (deselect with '-m \"not slow\"')",
]
